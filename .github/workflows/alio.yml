name: ALIO Independent Monitor

# Automatic triggers disabled to prioritize Nara monitor.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Collect without sending alerts or changing production DB'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: nara-env-alio-monitor
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Collect alio independently
        env:
          ALIO_NTFY_TOPIC: ${{ secrets.ALIO_NTFY_TOPIC }}
          DRY_RUN: ${{ inputs.dry_run }}
          PYTHONUNBUFFERED: '1'
          TZ: Asia/Seoul
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python run_source.py --source alio "${args[@]}"
      - name: Persist only alio state
        if: ${{ always() && inputs.dry_run != true }}
        run: python scripts/persist_state.py alio
      - name: Retain DB for recovery on failure
        if: ${{ failure() && inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: alio-state-${{ github.run_id }}
          path: alio_notices.db
          retention-days: 7
