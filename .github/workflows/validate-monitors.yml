name: Validate independent monitors
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/*.yml'
      - 'cloud_run.py'
      - 'run_source.py'
      - 'core/**'
      - 'scripts/**'
      - 'tests/**'
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pyyaml
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q cloud_run.py run_source.py core scripts
