name: Nara Environmental Notice Cloud Monitor

on:
  workflow_dispatch: # cron-job.org에서 2~3분마다 단독 호출

concurrency:
  group: nara-env-cloud-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-and-alert:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 나라장터 공고 수집 및 스마트폰 알림 발송
        env:
          PYTHONUNBUFFERED: '1'
          TZ: Asia/Seoul
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python run_source.py --source nara

      - name: 중복 방지 DB 상태 자동 동기화
        if: always()
        run: python scripts/persist_state.py nara
      - name: 실패 시 DB 복구본 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-state-${{ github.run_id }}
          path: |
            nara_notices.db
          retention-days: 7
