name: Nara Environmental Notice Cloud Monitor

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 나라장터 공고 수집 및 스마트폰 알림 발송
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python cloud_run.py

      - name: 중복 방지 DB 상태 자동 동기화
        run: |
          git config --global user.name "nara-bot"
          git config --global user.email "bot@github.com"
          git add nara_notices.db config.json || true
          git commit -m "Auto-update notice DB [skip ci]" || exit 0
          git push || true
